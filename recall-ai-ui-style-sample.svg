<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1067" viewBox="0 0 1600 1067">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7fbfa"/>
      <stop offset="0.55" stop-color="#f3f7fb"/>
      <stop offset="1" stop-color="#fffaf2"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1f7c72"/>
      <stop offset="1" stop-color="#31a393"/>
    </linearGradient>
    <filter id="phoneShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="34" stdDeviation="30" flood-color="#0f172a" flood-opacity="0.24"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#1b3748" flood-opacity="0.10"/>
    </filter>
    <style>
      .font { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .dark { fill: #102a43; }
      .body { fill: #526574; }
      .muted { fill: #78909c; }
      .white { fill: #ffffff; }
      .tealText { fill: #1f7c72; }
      .amberText { fill: #8a5700; }
      .title { font-size: 48px; font-weight: 800; letter-spacing: 0; }
      .subtitle { font-size: 22px; }
      .h2 { font-size: 27px; font-weight: 800; letter-spacing: 0; }
      .h3 { font-size: 17px; font-weight: 800; }
      .small { font-size: 13px; font-weight: 650; }
      .tiny { font-size: 12px; font-weight: 750; }
      .cardText { font-size: 15px; font-weight: 800; }
      .normal { font-size: 14px; font-weight: 600; }
      .question { font-size: 21px; font-weight: 760; }
    </style>
  </defs>

  <rect width="1600" height="1067" fill="url(#bg)"/>
  <circle cx="130" cy="110" r="210" fill="#1f7c72" opacity="0.12"/>
  <circle cx="1460" cy="150" r="180" fill="#f39c12" opacity="0.10"/>

  <g class="font">
    <text x="74" y="94" class="title dark">Recall AI UI Style Sample</text>
    <text x="74" y="128" class="subtitle body">移动优先 · 可信确认 · 复习闭环 · 低干扰学习工具</text>
    <g transform="translate(1340 66)">
      <rect width="42" height="42" rx="12" fill="#1f7c72"/>
      <rect x="54" width="42" height="42" rx="12" fill="#f39c12"/>
      <rect x="108" width="42" height="42" rx="12" fill="#102a43"/>
      <rect x="162" width="42" height="42" rx="12" fill="#f7fbfa" stroke="#d8e4e8"/>
    </g>

    <!-- Phone 1 -->
    <g transform="translate(74 176)" filter="url(#phoneShadow)">
      <rect width="386" height="812" rx="42" fill="#17222e"/>
      <rect x="15" y="15" width="356" height="782" rx="31" fill="#fbfdfc"/>
      <text x="39" y="52" class="tiny dark">9:41</text>
      <text x="279" y="52" class="tiny dark">Recall AI</text>
      <text x="37" y="97" class="normal body">晚上好，林同学</text>
      <text x="37" y="132" class="h2 dark">今天先完成</text>
      <text x="37" y="165" class="h2 dark">4 道错题复习</text>
      <rect x="309" y="75" width="42" height="42" rx="14" fill="url(#teal)"/>
      <text x="322" y="102" font-size="18" font-weight="800" fill="#fff">R</text>
      <rect x="37" y="188" width="312" height="154" rx="24" fill="url(#teal)"/>
      <circle cx="330" cy="197" r="70" fill="#fff" opacity="0.12"/>
      <text x="57" y="222" class="small white" opacity="0.86">今日待复习</text>
      <text x="57" y="274" font-size="46" font-weight="830" fill="#fff">4</text>
      <text x="57" y="304" class="normal white" opacity="0.92">预计 12 分钟 · 2 个薄弱知识点</text>
      <rect x="57" y="318" width="100" height="46" rx="15" fill="#fff"/>
      <text x="77" y="347" class="cardText tealText">开始复习</text>
      <text x="37" y="393" class="h3 dark">最近错题</text>
      <text x="293" y="393" class="small muted">查看全部</text>
      <g filter="url(#softShadow)">
        <rect x="37" y="414" width="312" height="72" rx="18" fill="#fff" stroke="#e5eef0"/>
        <rect x="51" y="428" width="44" height="44" rx="14" fill="#fff3dc"/>
        <text x="67" y="457" font-size="20" font-weight="900" fill="#bd6900">ƒ</text>
        <text x="107" y="445" class="cardText dark">一次函数图像</text>
        <text x="107" y="466" class="tiny muted">符号判断 · 昨天上传</text>
        <rect x="271" y="438" width="64" height="29" rx="14" fill="#e7f5f2"/>
        <text x="284" y="457" class="tiny tealText">待巩固</text>
      </g>
      <g filter="url(#softShadow)">
        <rect x="37" y="500" width="312" height="72" rx="18" fill="#fff" stroke="#e5eef0"/>
        <rect x="51" y="514" width="44" height="44" rx="14" fill="#fff3dc"/>
        <text x="69" y="543" font-size="20" font-weight="900" fill="#bd6900">x</text>
        <text x="107" y="531" class="cardText dark">一元一次方程</text>
        <text x="107" y="552" class="tiny muted">移项错误 · 2 天后复习</text>
        <rect x="279" y="524" width="56" height="29" rx="14" fill="#e7f5f2"/>
        <text x="293" y="543" class="tiny tealText">学习中</text>
      </g>
      <text x="37" y="618" class="h3 dark">薄弱知识点</text>
      <g filter="url(#softShadow)">
        <rect x="37" y="639" width="312" height="72" rx="18" fill="#fff" stroke="#e5eef0"/>
        <rect x="51" y="653" width="44" height="44" rx="14" fill="#fff3dc"/>
        <text x="66" y="682" font-size="20" font-weight="900" fill="#bd6900">%</text>
        <text x="107" y="670" class="cardText dark">概率与统计</text>
        <text x="107" y="691" class="tiny muted">正确率 62% · 建议 3 题</text>
        <rect x="287" y="663" width="48" height="29" rx="14" fill="#e7f5f2"/>
        <text x="299" y="682" class="tiny tealText">练习</text>
      </g>
      <rect x="33" y="733" width="320" height="64" rx="24" fill="#102a43"/>
      <text x="65" y="771" class="tiny white">首页</text>
      <text x="143" y="771" class="tiny" fill="#9fb4c3">错题</text>
      <text x="221" y="771" class="tiny" fill="#9fb4c3">复习</text>
      <text x="299" y="771" class="tiny" fill="#9fb4c3">我的</text>
    </g>

    <!-- Phone 2 -->
    <g transform="translate(490 176)" filter="url(#phoneShadow)">
      <rect width="386" height="812" rx="42" fill="#17222e"/>
      <rect x="15" y="15" width="356" height="782" rx="31" fill="#fbfdfc"/>
      <text x="39" y="52" class="tiny dark">9:41</text>
      <text x="281" y="52" class="tiny dark">识别确认</text>
      <rect x="37" y="75" width="42" height="42" rx="14" fill="#eef5f4"/>
      <text x="53" y="103" font-size="24" font-weight="800" fill="#1f7c72">‹</text>
      <text x="303" y="101" class="small muted">1 / 3</text>
      <text x="37" y="157" class="h2 dark">核对识别结果</text>
      <rect x="37" y="184" width="312" height="255" rx="28" fill="#eef4f7" stroke="#dce8ec"/>
      <rect x="97" y="218" width="235" height="190" rx="10" fill="#fff" transform="rotate(-2 214.5 313)" filter="url(#softShadow)"/>
      <rect x="123" y="245" width="190" height="9" rx="5" fill="#d7e1e5" transform="rotate(-2 218 250)"/>
      <rect x="123" y="272" width="145" height="9" rx="5" fill="#d7e1e5" transform="rotate(-2 196 277)"/>
      <rect x="123" y="299" width="176" height="9" rx="5" fill="#d7e1e5" transform="rotate(-2 211 304)"/>
      <rect x="123" y="326" width="112" height="9" rx="5" fill="#f4c36f" transform="rotate(-2 179 331)"/>
      <rect x="71" y="212" width="54" height="54" rx="16" fill="none" stroke="#1f7c72" stroke-width="5" stroke-dasharray="54 54 0 100"/>
      <path d="M295 212 h54 v54" fill="none" stroke="#1f7c72" stroke-width="5" stroke-linecap="round"/>
      <path d="M71 385 v54 h54" fill="none" stroke="#1f7c72" stroke-width="5" stroke-linecap="round"/>
      <path d="M349 385 v54 h-54" fill="none" stroke="#1f7c72" stroke-width="5" stroke-linecap="round"/>
      <rect x="37" y="461" width="312" height="64" rx="18" fill="#f8fbfb" stroke="#e5eef0"/>
      <text x="53" y="489" class="normal dark" font-weight="800">公式置信度偏低</text>
      <text x="53" y="509" class="tiny muted">请确认橙色字段</text>
      <rect x="213" y="489" width="120" height="8" rx="4" fill="#dce8e8"/>
      <rect x="213" y="489" width="94" height="8" rx="4" fill="#f39c12"/>
      <rect x="37" y="541" width="312" height="78" rx="17" fill="#fff" stroke="#dde9ec"/>
      <text x="53" y="568" class="tiny muted">题干</text>
      <text x="53" y="596" class="normal dark">解方程：2x - 5 = 7，求 x 的值。</text>
      <rect x="37" y="633" width="312" height="78" rx="17" fill="#fff" stroke="#dde9ec"/>
      <text x="53" y="660" class="tiny muted">学生答案</text>
      <text x="53" y="688" class="normal dark">x = 1</text>
      <text x="98" y="688" class="normal" fill="#f39c12" font-weight="900">?</text>
      <rect x="37" y="724" width="145" height="46" rx="15" fill="#fff" stroke="#d5e4e7"/>
      <text x="77" y="753" class="cardText dark">手动修改</text>
      <rect x="194" y="724" width="155" height="46" rx="15" fill="#1f7c72"/>
      <text x="238" y="753" class="cardText white">确认保存</text>
    </g>

    <!-- Phone 3 -->
    <g transform="translate(906 176)" filter="url(#phoneShadow)">
      <rect width="386" height="812" rx="42" fill="#17222e"/>
      <rect x="15" y="15" width="356" height="782" rx="31" fill="#fbfdfc"/>
      <text x="39" y="52" class="tiny dark">9:41</text>
      <text x="285" y="52" class="tiny dark">今日复习</text>
      <rect x="37" y="75" width="42" height="42" rx="14" fill="#eef5f4"/>
      <text x="53" y="103" font-size="24" font-weight="800" fill="#1f7c72">‹</text>
      <rect x="289" y="82" width="60" height="29" rx="14" fill="#e7f5f2"/>
      <text x="303" y="101" class="tiny tealText">第 2 题</text>
      <text x="37" y="157" class="h2 dark">先作答，再看提示</text>
      <rect x="37" y="185" width="312" height="392" rx="24" fill="#fff" stroke="#e3ecef" filter="url(#softShadow)"/>
      <rect x="55" y="203" width="94" height="29" rx="14" fill="#e7f5f2"/>
      <text x="67" y="222" class="tiny tealText">一元一次方程</text>
      <rect x="157" y="203" width="48" height="29" rx="14" fill="#e7f5f2"/>
      <text x="169" y="222" class="tiny tealText">移项</text>
      <text x="55" y="268" class="question dark">解方程：3x + 4 = 19。</text>
      <text x="55" y="300" class="question dark">请写出完整计算过程。</text>
      <rect x="55" y="330" width="276" height="118" rx="18" fill="#f8fbfb" stroke="#c9dadd" stroke-width="1.5" stroke-dasharray="7 7"/>
      <text x="129" y="395" class="normal muted">在这里输入你的答案</text>
      <rect x="55" y="466" width="276" height="78" rx="18" fill="#fff8e8" stroke="#f2dcae"/>
      <text x="73" y="494" class="normal amberText" font-weight="800">提示</text>
      <text x="73" y="519" class="small" fill="#6e5a2c">先把常数项移到等号右边，</text>
      <text x="73" y="539" class="small" fill="#6e5a2c">再把 x 的系数化为 1。</text>
      <rect x="55" y="594" width="276" height="46" rx="15" fill="#1f7c72"/>
      <text x="159" y="623" class="cardText white">提交作答</text>
      <text x="37" y="683" class="h3 dark">掌握反馈</text>
      <rect x="37" y="707" width="94" height="54" rx="16" fill="#f3f7f8"/>
      <text x="68" y="740" class="small dark" font-weight="800">困难</text>
      <rect x="146" y="707" width="94" height="54" rx="16" fill="#f3f7f8"/>
      <text x="177" y="740" class="small dark" font-weight="800">一般</text>
      <rect x="255" y="707" width="94" height="54" rx="16" fill="#e7f5f2"/>
      <text x="286" y="740" class="small tealText" font-weight="800">掌握</text>
    </g>

    <!-- Side panel -->
    <g transform="translate(1322 184)">
      <rect width="204" height="446" rx="24" fill="#ffffff" opacity="0.68" stroke="#cddbe1" filter="url(#softShadow)"/>
      <text x="24" y="48" font-size="25" font-weight="800" fill="#102a43">设计基调</text>
      <text x="24" y="82" class="normal body">AI 包在可信流程里，</text>
      <text x="24" y="104" class="normal body">复习是首页主任务。</text>
      <line x1="24" y1="130" x2="180" y2="130" stroke="#e1eaee"/>
      <text x="24" y="162" class="cardText dark">1. 首页即行动</text>
      <text x="24" y="184" class="small body">待复习、上传、进度</text>
      <line x1="24" y1="210" x2="180" y2="210" stroke="#e1eaee"/>
      <text x="24" y="242" class="cardText dark">2. AI 可见可改</text>
      <text x="24" y="264" class="small body">置信度、原图、确认</text>
      <line x1="24" y1="290" x2="180" y2="290" stroke="#e1eaee"/>
      <text x="24" y="322" class="cardText dark">3. 先答后看</text>
      <text x="24" y="344" class="small body">提示、步骤、答案分层</text>
      <line x1="24" y1="370" x2="180" y2="370" stroke="#e1eaee"/>
      <text x="24" y="402" class="cardText dark">4. 数据服务行动</text>
      <text x="24" y="424" class="small body">只放能指导复习的指标</text>

      <rect y="476" width="204" height="48" rx="16" fill="#fff" stroke="#e3ecef"/>
      <text x="17" y="506" class="small body">Primary #1F7C72</text>
      <rect y="536" width="204" height="48" rx="16" fill="#fff" stroke="#e3ecef"/>
      <text x="17" y="566" class="small body">Accent #F39C12</text>
      <rect y="596" width="204" height="48" rx="16" fill="#fff" stroke="#e3ecef"/>
      <text x="17" y="626" class="small body">Text #102A43</text>
    </g>
  </g>
</svg>
